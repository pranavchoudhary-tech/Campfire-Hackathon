<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Descent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas {
  display: block;
  cursor: none;
}
#hint {
  color: #223344;
  font-size: 10px;
  letter-spacing: 1.5px;
  margin-top: 6px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">WASD / Arrows: Move &amp; Jump &nbsp;|&nbsp; S/↓: Slide &nbsp;|&nbsp; Z: Punch &nbsp;|&nbsp; X: Kick &nbsp;|&nbsp; Wall-Jump: Jump while against wall</div>
<script>
// ═══════════════════════════════════════════════════════════════
//  SHADOW DESCENT  ·  "Beneath the Surface"
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const BW = 800, BH = 450;

(function resize() {
  const s = Math.min(window.innerWidth / BW, (window.innerHeight - 28) / BH);
  canvas.width  = BW;
  canvas.height = BH;
  canvas.style.width  = BW * s + 'px';
  canvas.style.height = BH * s + 'px';
})();
window.addEventListener('resize', () => location.reload());

// ── INPUT ────────────────────────────────────────────────────
const K = {}, JP = {};
window.addEventListener('keydown', e => { if (!K[e.code]) JP[e.code] = true; K[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup',   e => { K[e.code] = false; });
const left  = () => K['ArrowLeft']  || K['KeyA'];
const right = () => K['ArrowRight'] || K['KeyD'];
const down  = () => K['ArrowDown']  || K['KeyS'];
const jumpK = () => K['Space'] || K['ArrowUp'] || K['KeyW'];
const punchK = () => JP['KeyZ'] || JP['KeyJ'];
const kickK  = () => JP['KeyX'] || JP['KeyK'];

// ── UTILS ───────────────────────────────────────────────────
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
function overlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ── SCREEN SHAKE ────────────────────────────────────────────
let shk = 0, shkMag = 0;
const shake = (m, d) => { shkMag = m; shk = d; };

// ── PARTICLES ───────────────────────────────────────────────
const PARTS = [];
function part(x, y, vx, vy, col, sz, life) {
  PARTS.push({ x, y, vx, vy, col, sz, life, ml: life });
}
function burst(x, y, col = '#ff6600', n = 10) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI*2), s = rnd(2, 7);
    part(x, y, Math.cos(a)*s, Math.sin(a)*s, col, rnd(2,4), rnd(18,36));
  }
}
function dust(x, y) {
  for (let i = 0; i < 3; i++)
    part(x+rnd(-8,8), y, rnd(-1.5,1.5), rnd(-2.5,-0.5), '#556', rnd(2,3), rnd(12,20));
}
function tickParts() {
  for (let i = PARTS.length-1; i >= 0; i--) {
    const p = PARTS[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.vx *= 0.92; p.life--;
    if (p.life <= 0) PARTS.splice(i, 1);
  }
}
function drawParts(cx) {
  PARTS.forEach(p => {
    ctx.globalAlpha = p.life / p.ml;
    ctx.fillStyle   = p.col;
    ctx.beginPath();
    ctx.arc(p.x - cx, p.y, p.sz * (p.life/p.ml), 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── PHYSICS HELPERS ─────────────────────────────────────────
const GRAV = 0.52, MAXFALL = 16;
let platforms = [];

function resolveX(e, hb) {
  e.onWall = 0;
  for (const p of platforms) {
    if (!overlap(hb, p)) continue;
    if (e.vx > 0) { e.x = p.x - hb.w - (hb.x - e.x); e.onWall =  1; }
    else           { e.x = p.x + p.w  - (hb.x - e.x); e.onWall = -1; }
    e.vx = 0;
  }
}
function resolveY(e, hb) {
  e.onGround = false;
  for (const p of platforms) {
    if (!overlap(hb, p)) continue;
    if (e.vy > 0) { e.y = p.y - hb.h - (hb.y - e.y); e.onGround = true; }
    else           { e.y = p.y + p.h  - (hb.y - e.y); }
    e.vy = 0;
  }
}
function phys(e) {
  if (!e.onGround) e.vy = Math.min(e.vy + GRAV, MAXFALL);
  const hbX = () => ({ x: e.x + (e.slideH ? 4 : 0), y: e.y + (e.slideH ? e.h/2 : 0), w: e.w - (e.slideH ? 8 : 0), h: e.slideH ? e.h/2 : e.h });
  e.x += e.vx; resolveX(e, hbX());
  e.y += e.vy; resolveY(e, hbX());
}

// ── PLAYER ──────────────────────────────────────────────────
const P = {
  x: 80, y: 350, w: 26, h: 50,
  vx: 0, vy: 0, facing: 1,
  onGround: false, onWall: 0,
  hp: 100, maxHp: 100,
  lives: 3,
  state: 'idle',   // idle run jump fall slide wallslide attack kick hurt dead
  slideH: false,
  atkTimer: 0, atkType: 'punch',
  hurtTimer: 0, iframes: 0,
  slideTimer: 0,
  coyote: 0, jbuf: 0, jumps: 0,
  anim: 0, af: 0,
  _atkHit: new Set()
};

function hitPlayer(dmg) {
  if (P.iframes > 0 || P.state === 'dead') return;
  P.hp     -= dmg;
  P.hurtTimer = 28;
  P.iframes   = 40;
  P.vy = -4;
  shake(5, 10);
  burst(P.x + P.w/2, P.y + P.h/3, '#ff2222', 8);
}

function tickPlayer() {
  if (P.atkTimer  > 0) P.atkTimer--;
  if (P.hurtTimer > 0) P.hurtTimer--;
  if (P.slideTimer> 0) P.slideTimer--;
  if (P.coyote    > 0) P.coyote--;
  if (P.jbuf      > 0) P.jbuf--;
  if (P.iframes   > 0) P.iframes--;

  if (P.onGround) { P.coyote = 8; P.jumps = 0; }

  if (JP['Space'] || JP['ArrowUp'] || JP['KeyW']) P.jbuf = 10;

  const ctrl = P.hurtTimer === 0 && P.state !== 'dead';
  const atk  = P.atkTimer  > 0;

  if (ctrl) {
    if (P.state !== 'slide' && P.state !== 'wallslide') {
      if (right())      { P.vx = 5.5; P.facing =  1; }
      else if (left())  { P.vx = -5.5; P.facing = -1; }
      else              { P.vx *= 0.68; }
    }

    // Slide
    if (P.onGround && !P.slideH && down() && (JP['ArrowDown'] || JP['KeyS']) && Math.abs(P.vx) > 1) {
      P.state = 'slide'; P.slideH = true;
      P.vx = P.facing * 9; P.slideTimer = 28;
      dust(P.x + P.w/2, P.y + P.h);
    }
    if (P.slideH && P.slideTimer <= 0) { P.slideH = false; }

    // Wall slide
    if (!P.onGround && P.onWall !== 0) {
      const push = (P.onWall === 1 && right()) || (P.onWall === -1 && left());
      if (push) {
        P.vy = Math.min(P.vy, 1.8);
        P.state = 'wallslide';
        P.facing = -P.onWall;
      }
    }

    // Jump
    if (P.jbuf > 0) {
      if (P.coyote > 0) {
        P.vy = -13; P.jbuf = 0; P.coyote = 0; P.jumps = 1;
        if (P.slideH) { P.slideH = false; }
        dust(P.x + P.w/2, P.y + P.h);
      } else if (P.state === 'wallslide' || (P.onWall !== 0 && !P.onGround)) {
        P.vy = -11; P.vx = -P.onWall * 9; P.facing = -P.onWall;
        P.jbuf = 0; P.state = 'jump';
        shake(2, 4);
        dust(P.x + P.w/2, P.y + P.h/2);
      } else if (P.jumps < 2) {
        P.vy = -11 * 0.85; P.jumps++; P.jbuf = 0;
        burst(P.x + P.w/2, P.y + P.h, '#4466ff', 5);
      }
    }

    // Attacks
    if (!atk) {
      if (punchK()) { P.atkTimer = 20; P.atkType = 'punch'; P._atkHit.clear(); }
      else if (kickK()) { P.atkTimer = 20; P.atkType = 'kick';  P._atkHit.clear(); }
    }
  }

  phys(P);

  // Derive state
  if (P.state !== 'dead') {
    if (P.hurtTimer > 0) { P.state = 'hurt'; }
    else if (P.atkTimer > 0) { P.state = P.atkType === 'punch' ? 'attack' : 'kick'; }
    else if (P.slideH) { P.state = 'slide'; }
    else if (P.state === 'wallslide') { if (P.onGround || (!right() && !left())) { P.state = 'idle'; } }
    else if (!P.onGround) { P.state = P.vy < 0 ? 'jump' : 'fall'; }
    else { P.state = Math.abs(P.vx) > 0.5 ? 'run' : 'idle'; }
  }

  // Attack hit detection
  if (P.atkTimer > 3 && P.atkTimer < 18) {
    const ab = getAtkBox(P);
    for (const e of allFoes()) {
      if (e.hp <= 0) continue;
      if (P._atkHit.has(e)) continue;
      if (overlap(ab, foeHB(e))) {
        const dmg = P.atkType === 'kick' ? 35 : 25;
        hurtFoe(e, dmg, P.facing);
        P._atkHit.add(e);
      }
    }
  }

  // Foe attacks hit player
  for (const e of allFoes()) {
    if (e.hp <= 0 || P.iframes > 0) continue;
    const ab = foeAtkBox(e);
    if (ab && overlap(ab, { x:P.x, y:P.y, w:P.w, h:P.h })) hitPlayer(e.isBoss ? 12 : 6);
  }

  // Camera
  if (currentLevel === 0) {
    targetCam = clamp(P.x - BW * 0.32, 0, 4100 - BW);
    camX = lerp(camX, targetCam, 0.09);
  } else { camX = 0; }

  // Bounds
  if (currentLevel !== 0) P.x = clamp(P.x, 22, BW - P.w - 22);

  if (P.hp <= 0 && P.state !== 'dead') {
    P.lives--;
    shake(10, 25);
    burst(P.x + P.w/2, P.y + P.h/2, '#ff2222', 20);
    if (P.lives <= 0) {
      P.state = 'dead';
      setTimeout(() => setState('gameover'), 1500);
    } else {
      // Respawn on same level
      P.state = 'hurt';
      P.hp = P.maxHp;
      P.hurtTimer = 60;
      P.iframes = 90;
      P.vx = 0; P.vy = -6;
      // Respawn position per level
      if (currentLevel === 0) { P.x = Math.max(80, P.x - 60); P.y = Math.min(P.y, 400); }
      else if (currentLevel === 1) { P.x = 100; P.y = 370; }
      else { P.x = 100; P.y = 370; }
    }
  }

  // Level 0 exit — only when player intentionally reaches portal (not knocked there while hurt)
  if (currentLevel === 0 && P.x > 3940 && P.state !== 'hurt' && P.state !== 'dead' && P.onGround) {
    nextLevel('UNDERGROUND\nARENA AWAITS');
  }

  // Level 1 wave progress
  if (currentLevel === 1 && enemies.length === 0 && waveDelay === 0) {
    if (wave < 3) { wave++; waveDelay = 100; waveAnnounce = 150; }
    else if (wave === 3) { wave = 99; nextLevel('FACE YOUR\nSHADOW SELF'); }
  }
  if (waveDelay > 0) { waveDelay--; if (waveDelay === 0) spawnWave(wave); }

  // Level 2 boss dead
  if (currentLevel === 2 && boss && boss.hp <= 0 && gameState === 'playing') {
    setState('victory');
  }

  P.anim++;
  if (P.anim > 5) { P.anim = 0; P.af++; }

  // Bound P to a large level
  if (P.y > BH + 120) hitPlayer(999);
}

function getAtkBox(e) {
  const isKick = e.atkType === 'kick' || e === P && P.atkType === 'kick';
  const reach = isKick ? 52 : 44;
  const yOff  = isKick ? 24 : 12;
  return {
    x: e.facing > 0 ? e.x + e.w : e.x - reach,
    y: e.y + yOff,
    w: reach, h: isKick ? 22 : 26
  };
}

// ── ENEMIES ─────────────────────────────────────────────────
let enemies = [], boss = null;

function mkEnemy(x, y, type) {
  return {
    x, y, w: 26, h: 50,
    vx: 0, vy: 0, facing: -1,
    onGround: false, onWall: 0, slideH: false,
    hp: type === 'runner' ? 25 : 35, maxHp: type === 'runner' ? 25 : 35,
    type, state: 'patrol',
    atkTimer: 0, hurtTimer: 0, atkCD: 0,
    patDir: 1, patDist: 0, patMax: rnd(50,110),
    anim: Math.random() * 100,
    eyeCol: type === 'runner' ? '#00ffff' : '#ff4400',
    isBoss: false
  };
}

function mkBoss(x, y) {
  return {
    x, y, w: 34, h: 60,
    vx: 0, vy: 0, facing: -1,
    onGround: false, onWall: 0, slideH: false,
    hp: 180, maxHp: 180,
    state: 'chase',
    atkTimer: 0, hurtTimer: 0, atkCD: 0,
    specialCD: 0, phase: 1, anim: 0,
    eyeCol: '#ff0044', isBoss: true
  };
}

function allFoes() { return boss ? [...enemies, boss] : enemies; }
function foeHB(e)  { return { x:e.x, y:e.y, w:e.w, h:e.h }; }
function foeAtkBox(e) {
  if (e.atkTimer <= 6 || e.atkTimer > e.w+18) return null;
  return {
    x: e.facing > 0 ? e.x + e.w : e.x - 44,
    y: e.y + 8, w: 44, h: e.h * 0.7
  };
}

function hurtFoe(e, dmg, dir) {
  e.hp -= dmg;
  e.hurtTimer = 18; e.vx = dir * 4.5; e.vy = -3;
  shake(3, 6);
  burst(e.x + e.w/2, e.y + e.h/3, e.isBoss ? '#ff0088' : '#ff6600', e.isBoss ? 18 : 10);
}

function tickEnemies() {
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    tickFoe(e);
    if (e.hp <= 0 && e.y > BH + 100) enemies.splice(i, 1);
  }
  if (boss) tickFoe(boss);
}

function tickFoe(e) {
  if (e.atkCD  > 0) e.atkCD--;
  if (e.atkTimer > 0) e.atkTimer--;

  if (e.hp <= 0) {
    e.vy += 0.4; e.x += e.vx; e.y += e.vy; e.vx *= 0.88;
    return;
  }

  if (e.hurtTimer > 0) {
    e.hurtTimer--;
    phys(e);
    return;
  }

  const dx = P.x - e.x, dy = P.y - e.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  e.facing = dx > 0 ? 1 : -1;

  if (e.isBoss) {
    // Phase 2
    if (e.hp < e.maxHp * 0.5 && e.phase === 1) {
      e.phase = 2; e.eyeCol = '#ff00cc';
      shake(12, 35);
      burst(e.x + e.w/2, e.y + e.h/2, '#ff00ff', 25);
    }

    e.specialCD++;
    const specialInterval = e.phase === 2 ? 160 : 220;
    if (e.specialCD >= specialInterval) {
      e.specialCD = 0;
      e.vx = e.facing * (e.phase === 2 ? 9 : 6);
      e.vy = -7; e.atkTimer = 28; e.atkCD = 30;
      shake(4, 6);
    } else if (dist < 85 && e.atkCD === 0) {
      e.atkTimer = 22; e.atkCD = 110;
    } else {
      e.vx = e.facing * (e.phase === 2 ? 2.2 : 1.5);
    }
  } else {
    if (dist < 280) {
      const range = e.type === 'runner' ? 300 : 72;
      if (dist < range && e.atkCD === 0) {
        if (e.type === 'runner') {
          e.vx = e.facing * 9; e.vy = -6; e.atkTimer = 18; e.atkCD = 140;
        } else {
          e.vx = 0; e.atkTimer = 18; e.atkCD = 110;
        }
      } else if (dist >= range) {
        e.vx = e.facing * (e.type === 'runner' ? 2.0 : 1.4);
      } else { e.vx *= 0.75; }
    } else {
      e.vx = e.patDir * 0.8;
      e.patDist += Math.abs(e.vx);
      if (e.patDist > e.patMax) { e.patDir *= -1; e.patDist = 0; e.facing = e.patDir; }
    }
  }

  phys(e);
  if (e.y > BH + 80) { e.hp = 0; }
}

// ── LEVELS ──────────────────────────────────────────────────
let currentLevel = 0, camX = 0, targetCam = 0;
let wave = 1, waveDelay = 0, waveAnnounce = 0;
let levelTimer = 0;

function addP(x, y, w, h = 18) { platforms.push({ x, y, w, h }); }

function buildLevel1() {
  platforms = []; enemies = []; boss = null; PARTS.length = 0;

  // Ground sections
  addP(-60, 420, 280, 30);
  addP( 290, 420, 160, 30);
  addP( 530, 380, 100, 20);   // raised
  addP( 720, 420, 120, 30);

  addP( 920, 350, 90, 18);
  addP(1080, 420, 190, 30);

  // Low-ceiling slide zone
  // Fix: ceiling starts at x=1010 (where raised platform ends) to avoid
  // overlap at x=980-1010 that caused physics double-collision & random death
  addP(1010, 325, 270, 14);   // ceiling
  addP(1050, 420, 250, 30);   // floor under ceiling

  addP(1360, 420, 120, 30);
  addP(1560, 360, 90, 18);
  addP(1720, 295, 90, 18);
  addP(1870, 230, 90, 18);

  addP(2020, 195, 200, 18);
  // Wall jump section — original route restored
  // Bug fix: top ledge placed BETWEEN the walls (x=2238 to x=2420) so it
  // never overlaps a wall corner — eliminates the physics squeeze that caused random death
  addP(2220, 100, 18, 320);   // left wall
  addP(2420, 100, 18, 320);   // right wall
  addP(2238, 100, 182, 18);   // top ledge (sits between the two walls, no corner overlap)

  addP(2500, 310, 120, 18);
  addP(2690, 420, 90, 30);

  // 2nd slide section
  addP(2680, 315, 320, 14);   // ceiling
  addP(2650, 420, 380, 30);

  addP(3100, 390, 100, 18);
  addP(3280, 330, 100, 18);
  addP(3440, 265, 100, 18);

  // Final run
  addP(3580, 420, 500, 30);

  // Safety net — 50px thick to prevent fast-fall tunneling (MAXFALL=16px/frame)
  addP(-100, 448, 4300, 50);

  // Enemies — original positions
  enemies.push(mkEnemy(520, 360, 'runner'));
  enemies.push(mkEnemy(900, 330, 'fighter'));
  enemies.push(mkEnemy(1400, 400, 'fighter'));
  enemies.push(mkEnemy(1720, 275, 'runner'));
  enemies.push(mkEnemy(2510, 400, 'fighter'));
  enemies.push(mkEnemy(2800, 400, 'fighter'));
  enemies.push(mkEnemy(3300, 310, 'runner'));
  enemies.push(mkEnemy(3700, 400, 'fighter'));

  P.x = 80; P.y = 370; P.vx = 0; P.vy = 0; P.hp = 100; P.lives = 3; P.state = 'idle';
  P.iframes = 0; P.hurtTimer = 0; P.atkTimer = 0; P.slideH = false; P.jumps = 0;
  camX = 0; targetCam = 0;
}

function buildLevel2() {
  platforms = []; enemies = []; boss = null; PARTS.length = 0;

  addP(0,   420, 800, 30);    // floor
  addP(0,   0,   18, 450);    // left wall
  addP(782, 0,   18, 450);    // right wall
  addP(140, 295, 130, 16);
  addP(530, 295, 130, 16);
  addP(320, 210, 160, 16);

  P.x = 80; P.y = 370; P.vx = 0; P.vy = 0; P.hp = P.maxHp; P.state = 'idle';
  P.iframes = 120; P.hurtTimer = 0; P.atkTimer = 0; P.slideH = false; P.jumps = 0;
  wave = 1; waveDelay = 90; waveAnnounce = 160; camX = 0;
  enemies = [];
}

function spawnWave(w) {
  enemies = [];
  if (w === 1) {
    enemies.push(mkEnemy(550, 370, 'runner'));
    enemies.push(mkEnemy(640, 370, 'fighter'));
  } else if (w === 2) {
    enemies.push(mkEnemy(500, 370, 'fighter'));
    enemies.push(mkEnemy(600, 370, 'runner'));
    enemies.push(mkEnemy(690, 370, 'fighter'));
  } else if (w === 3) {
    for (let i = 0; i < 3; i++) {
      const e = mkEnemy(480 + i*100, 370, 'fighter');
      e.hp = e.maxHp = 45; enemies.push(e);
    }
  }
}

function buildLevel3() {
  platforms = []; enemies = []; boss = null; PARTS.length = 0;

  addP(0,   420, 900, 30);
  addP(0,   0,   18, 450);
  addP(882, 0,   18, 450);
  addP(90,  275, 130, 16);
  addP(680, 275, 130, 16);
  addP(350, 190, 180, 16);

  boss = mkBoss(680, 360);
  P.x = 80; P.y = 370; P.vx = 0; P.vy = 0; P.hp = P.maxHp; P.state = 'idle';
  P.iframes = 120; P.hurtTimer = 0; P.atkTimer = 0; P.slideH = false; P.jumps = 0;
  camX = 0;
}

// ── GAME STATE ──────────────────────────────────────────────
let gameState = 'menu';
let transText = '', transTimer = 0;
let frame = 0;

function setState(s) { gameState = s; }
function nextLevel(txt) {
  if (gameState !== 'playing') return;
  setState('transition');
  transText = txt;
  transTimer = 130;
  setTimeout(() => {
    const n = currentLevel + 1;
    if (n === 1) { currentLevel = 1; buildLevel2(); setState('playing'); levelTimer = 0; }
    else if (n === 2) { currentLevel = 2; buildLevel3(); setState('playing'); levelTimer = 0; }
  }, 2200);
}

// ── DRAWING ─────────────────────────────────────────────────

function drawBG() {
  const t = frame;
  if (currentLevel === 0) drawBG_City(t);
  else drawBG_Underground(t);
}

// ═══ LEVEL 0 — DAYTIME CITY ══════════════════════════════════
function drawBG_City(t) {
  // Sky gradient — bright day blue
  const sky = ctx.createLinearGradient(0, 0, 0, BH);
  sky.addColorStop(0,    '#5bc8f5');
  sky.addColorStop(0.45, '#87dcf7');
  sky.addColorStop(0.75, '#c8eefa');
  sky.addColorStop(1,    '#d4e8c2');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, BW, BH);

  // ── Sun ────────────────────────────────────────────────
  const sunX = BW * 0.82, sunY = 55;
  const sunG = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 70);
  sunG.addColorStop(0,   '#fffde0');
  sunG.addColorStop(0.3, '#ffe97a');
  sunG.addColorStop(0.7, '#ffcc3388');
  sunG.addColorStop(1,   'transparent');
  ctx.fillStyle = sunG; ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(sunX, sunY, 70, 0, Math.PI*2); ctx.fill();
  // Sun disc
  ctx.fillStyle = '#fff8c0';
  ctx.shadowColor = '#ffe97a'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(sunX, sunY, 22, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // ── Clouds (parallax slow) ─────────────────────────────
  ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.88;
  const clouds = [
    { bx:60,  by:38, rx:55, ry:20, p:0.04 },
    { bx:280, by:25, rx:70, ry:24, p:0.03 },
    { bx:520, by:48, rx:45, ry:16, p:0.05 },
    { bx:700, by:30, rx:60, ry:22, p:0.035},
  ];
  clouds.forEach(c => {
    const cx2 = ((c.bx - camX * c.p) % (BW + 160) + BW + 160) % (BW + 160) - 80;
    ctx.beginPath(); ctx.ellipse(cx2, c.by, c.rx, c.ry, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx2 - c.rx*0.4, c.by + c.ry*0.3, c.rx*0.6, c.ry*0.75, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx2 + c.rx*0.4, c.by + c.ry*0.2, c.rx*0.55, c.ry*0.7, 0, 0, Math.PI*2); ctx.fill();
  });

  // ── Far city skyline (very slow parallax) ─────────────
  ctx.globalAlpha = 1;
  const farBuildings = [
    { bx:0,   bw:60,  bh:160, col:'#b8ccd8' },
    { bx:55,  bw:45,  bh:120, col:'#c2d4de' },
    { bx:96,  bw:70,  bh:190, col:'#adbfcc' },
    { bx:160, bw:50,  bh:140, col:'#b5c8d5' },
    { bx:205, bw:80,  bh:200, col:'#a8bcc9' },
    { bx:278, bw:55,  bh:130, col:'#beccd8' },
    { bx:326, bw:65,  bh:170, col:'#afc3cf' },
    { bx:383, bw:45,  bh:145, col:'#b2c5d2' },
    { bx:420, bw:75,  bh:185, col:'#a6bac7' },
    { bx:488, bw:55,  bh:125, col:'#bccdd9' },
    { bx:535, bw:70,  bh:160, col:'#adbfcc' },
    { bx:598, bw:50,  bh:210, col:'#a4b8c5' },
    { bx:640, bw:60,  bh:150, col:'#b0c3d0' },
    { bx:692, bw:80,  bh:175, col:'#a9bdc9' },
    { bx:764, bw:50,  bh:135, col:'#bdcdd9' },
  ];
  farBuildings.forEach(b => {
    const bx = ((b.bx - camX * 0.06) % (BW+200) + BW+200) % (BW+200) - 100;
    const by = BH - b.bh;
    ctx.fillStyle = b.col;
    ctx.fillRect(bx, by, b.bw, b.bh);
    // Windows
    ctx.fillStyle = 'rgba(180,220,255,0.5)';
    for (let wy = by+8; wy < BH - 12; wy += 16) {
      for (let wx = bx+5; wx < bx+b.bw-8; wx += 10) {
        if (Math.sin(wx*7.3 + wy*3.1) > 0.1) ctx.fillRect(wx, wy, 5, 8);
      }
    }
    // Rooftop edge
    ctx.fillStyle = 'rgba(100,140,160,0.4)';
    ctx.fillRect(bx, by, b.bw, 3);
  });

  // ── Mid city buildings (medium parallax) ──────────────
  const midBuildings = [
    { bx:20,  bw:55,  bh:130, col:'#445566', wc:'rgba(150,210,255,0.55)' },
    { bx:70,  bw:40,  bh:100, col:'#3d4f60', wc:'rgba(255,230,130,0.45)' },
    { bx:106, bw:65,  bh:155, col:'#3a4e5e', wc:'rgba(150,210,255,0.55)' },
    { bx:165, bw:50,  bh:115, col:'#3f5264', wc:'rgba(255,230,130,0.45)' },
    { bx:210, bw:75,  bh:165, col:'#374b5a', wc:'rgba(150,210,255,0.55)' },
    { bx:280, bw:55,  bh:120, col:'#3c5060', wc:'rgba(255,230,130,0.45)' },
    { bx:330, bw:70,  bh:145, col:'#384c5c', wc:'rgba(150,210,255,0.55)' },
    { bx:393, bw:45,  bh:110, col:'#405264', wc:'rgba(255,230,130,0.45)' },
    { bx:432, bw:80,  bh:170, col:'#364a58', wc:'rgba(150,210,255,0.55)' },
    { bx:505, bw:55,  bh:125, col:'#3b4f5f', wc:'rgba(255,230,130,0.45)' },
    { bx:554, bw:70,  bh:148, col:'#384c5c', wc:'rgba(150,210,255,0.55)' },
    { bx:616, bw:50,  bh:115, col:'#3e5262', wc:'rgba(255,230,130,0.45)' },
    { bx:660, bw:75,  bh:162, col:'#364a59', wc:'rgba(150,210,255,0.55)' },
    { bx:728, bw:55,  bh:128, col:'#3c5060', wc:'rgba(255,230,130,0.45)' },
    { bx:776, bw:60,  bh:140, col:'#374b5a', wc:'rgba(150,210,255,0.55)' },
  ];
  midBuildings.forEach(b => {
    const bx = ((b.bx - camX * 0.25) % (BW+200) + BW+200) % (BW+200) - 100;
    const by = BH - b.bh;
    ctx.fillStyle = b.col;
    ctx.fillRect(bx, by, b.bw, b.bh);
    // Windows grid
    for (let wy = by+8; wy < BH-14; wy += 14) {
      for (let wx = bx+5; wx < bx+b.bw-7; wx += 9) {
        ctx.fillStyle = b.wc;
        if (Math.sin(wx*5.1 + wy*2.7 + 1.2) > 0) ctx.fillRect(wx, wy, 5, 7);
      }
    }
    // Rooftop detail
    ctx.fillStyle = 'rgba(80,110,130,0.5)';
    ctx.fillRect(bx, by, b.bw, 4);
    // Antenna
    if (b.bh > 140) {
      ctx.strokeStyle = 'rgba(80,110,130,0.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(bx+b.bw/2, by); ctx.lineTo(bx+b.bw/2, by-18); ctx.stroke();
      ctx.fillStyle = '#ff4444'; ctx.shadowColor='#ff4444'; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(bx+b.bw/2, by-18, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
  });

  // ── Street level: road + pavement ─────────────────────
  // Sidewalk — starts at y=421 (just below platform top at 420) so player legs are always visible
  ctx.fillStyle = '#c8bfb0'; ctx.globalAlpha = 1;
  ctx.fillRect(0, 421, BW, 29);
  // Road marking dashes
  ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 2; ctx.setLineDash([18,14]);
  ctx.beginPath(); ctx.moveTo(0, 436); ctx.lineTo(BW, 436); ctx.stroke();
  ctx.setLineDash([]);

  // ── Foreground street fixtures ────────────────────────
  for (let i = 0; i < 6; i++) {
    const lx = ((i * 200 + 80 - camX * 0.9) % (BW+200) + BW+200) % (BW+200) - 60;
    // Lamppost
    ctx.fillStyle = '#2a2e38'; ctx.globalAlpha = 1;
    ctx.fillRect(lx - 2, 330, 4, 90);
    ctx.fillRect(lx - 14, 330, 16, 4);
    // Lamp glow
    ctx.fillStyle = '#fff8aa'; ctx.shadowColor = '#ffe87a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(lx - 8, 333, 6, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ── Floating city dust / birds ─────────────────────────
  ctx.globalAlpha = 1;
  for (let i = 0; i < 6; i++) {
    const bx2 = ((i * 180 + t * (0.3 + i*0.08) - camX*0.1) % (BW+100) + BW+100) % (BW+100) - 30;
    const by2 = 60 + Math.sin(t*0.02 + i*1.4) * 20 + i * 22;
    ctx.fillStyle = '#334455';
    ctx.globalAlpha = 0.35;
    // Simple bird silhouette
    ctx.beginPath(); ctx.moveTo(bx2, by2);
    ctx.quadraticCurveTo(bx2+5, by2-3, bx2+10, by2);
    ctx.quadraticCurveTo(bx2+5, by2-1, bx2, by2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══ LEVEL 1 & 2 — BENEATH THE SURFACE (Underground City) ════
function drawBG_Underground(t) {
  const isArena = currentLevel === 1;
  // Level 2 = damp sewer/subway tunnel  |  Level 3 = deep forgotten undercity

  // ── 1. BASE — damp concrete / stone backdrop ──────────
  const baseG = ctx.createLinearGradient(0, 0, 0, BH);
  if (isArena) {
    baseG.addColorStop(0,   '#0e0f0c');
    baseG.addColorStop(0.4, '#141510');
    baseG.addColorStop(0.8, '#181a14');
    baseG.addColorStop(1,   '#0c0e0a');
  } else {
    baseG.addColorStop(0,   '#070810');
    baseG.addColorStop(0.4, '#0c0d18');
    baseG.addColorStop(0.8, '#101220');
    baseG.addColorStop(1,   '#080910');
  }
  ctx.fillStyle = baseG; ctx.globalAlpha = 1;
  ctx.fillRect(0, 0, BW, BH);

  // ── 2. FAR BACKGROUND WALL — brick / tiled concrete ──
  const brickDark  = isArena ? '#141612' : '#0f1020';
  const brickLight = isArena ? '#1e211a' : '#161828';
  const mortarCol  = isArena ? '#0c0e0a' : '#090a14';
  // Brick rows (far, slow parallax)
  const brickH = 22, brickW = 56;
  for (let row = 0; row < Math.ceil(BH/brickH)+1; row++) {
    const rowY = row * brickH;
    const offset = (row % 2) * (brickW / 2);
    for (let col = -1; col < Math.ceil(BW/brickW)+2; col++) {
      const bx = ((col * brickW + offset - camX * 0.08) % (BW + brickW*3) + BW + brickW*3) % (BW + brickW*3) - brickW;
      ctx.fillStyle = (row + col) % 3 === 0 ? brickDark : brickLight;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(bx + 1, rowY + 1, brickW - 2, brickH - 2);
    }
  }
  // Mortar grid
  ctx.strokeStyle = mortarCol; ctx.lineWidth = 1; ctx.globalAlpha = 1;
  for (let row = 0; row <= Math.ceil(BH/brickH)+1; row++) {
    ctx.beginPath(); ctx.moveTo(0, row*brickH); ctx.lineTo(BW, row*brickH); ctx.stroke();
  }

  // ── 3. CEILING — cracked concrete slab ───────────────
  const ceilCol  = isArena ? '#1a1c16' : '#12141e';
  const ceilCol2 = isArena ? '#232620' : '#1a1c2a';
  const ceilCol3 = isArena ? '#2d3128' : '#22253a';

  // Far slab
  ctx.fillStyle = ceilCol; ctx.globalAlpha = 1;
  ctx.fillRect(0, 0, BW, 48);
  // Mid slab with slight noise
  ctx.fillStyle = ceilCol2;
  ctx.beginPath(); ctx.moveTo(0,0);
  for (let x = 0; x <= BW; x += 12) {
    const n = Math.sin(x*0.09 + camX*0.008)*5 + Math.sin(x*0.17)*3;
    ctx.lineTo(x, 36 + n);
  }
  ctx.lineTo(BW,0); ctx.closePath(); ctx.fill();
  // Front slab edge
  ctx.fillStyle = ceilCol3;
  ctx.beginPath(); ctx.moveTo(0,0);
  for (let x = 0; x <= BW; x += 8) {
    const n = Math.sin(x*0.12 + camX*0.013 + 1.2)*6 + Math.sin(x*0.22)*2;
    ctx.lineTo(x, 26 + n);
  }
  ctx.lineTo(BW,0); ctx.closePath(); ctx.fill();

  // Ceiling concrete cracks
  ctx.strokeStyle = isArena ? '#3a3d30' : '#2a2d40';
  ctx.lineWidth = 1; ctx.globalAlpha = 0.7;
  for (let i = 0; i < 8; i++) {
    const cx2 = ((i * 170 + 40 - camX * 0.13) % (BW+170) + BW+170) % (BW+170) - 30;
    ctx.beginPath(); ctx.moveTo(cx2, 0);
    let cy = 0, cxx = cx2;
    while (cy < 50) { cy += rnd(6,14); cxx += rnd(-8,8); ctx.lineTo(cxx, cy); }
    ctx.stroke();
  }

  // Ceiling drips / water stains
  const dripC = isArena ? '#2a3020' : '#1a2030';
  for (let i = 0; i < 10; i++) {
    const dx = ((i * 130 + 60 - camX * 0.2) % (BW+130) + BW+130) % (BW+130) - 20;
    const dh = 18 + Math.sin(i*2.1)*10;
    ctx.fillStyle = dripC; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.moveTo(dx-3, 26); ctx.lineTo(dx+3, 26);
    ctx.lineTo(dx+1, 26+dh); ctx.lineTo(dx-1, 26+dh); ctx.closePath(); ctx.fill();
    // water droplet
    const dp = Math.abs(Math.sin(t*0.04 + i*0.9));
    ctx.fillStyle = isArena ? '#44553a' : '#334466';
    ctx.shadowColor = isArena ? '#6a8855' : '#4466aa'; ctx.shadowBlur = 5;
    ctx.globalAlpha = 0.6 * dp;
    ctx.beginPath(); ctx.arc(dx, 26+dh+4*dp, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ── 4. STREET GRATE / MANHOLE in ceiling (light leak) ─
  const gratePositions = [160, 400, 640];
  gratePositions.forEach((gx, gi) => {
    const ngx = ((gx - camX * 0.15) % (BW + 200) + BW + 200) % (BW + 200) - 50;
    // Light shaft coming through
    const shaftAlpha = 0.12 + Math.sin(t*0.025 + gi)*0.04;
    const shaftG = ctx.createLinearGradient(ngx, 0, ngx, 180);
    shaftG.addColorStop(0, isArena ? `rgba(180,200,140,${shaftAlpha*2})` : `rgba(100,120,200,${shaftAlpha*2})`);
    shaftG.addColorStop(1, 'transparent');
    ctx.fillStyle = shaftG; ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(ngx-18, 0); ctx.lineTo(ngx+18, 0);
    ctx.lineTo(ngx+30, 180); ctx.lineTo(ngx-30, 180);
    ctx.closePath(); ctx.fill();
    // Grate frame
    ctx.fillStyle = isArena ? '#2a2e22' : '#222232';
    ctx.globalAlpha = 1;
    ctx.fillRect(ngx-18, 0, 36, 8);
    // Grate bars
    ctx.strokeStyle = isArena ? '#3a3e30' : '#303040';
    ctx.lineWidth = 2;
    for (let b = -12; b <= 12; b += 8) {
      ctx.beginPath(); ctx.moveTo(ngx+b, 0); ctx.lineTo(ngx+b, 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ngx-18, b+14 < 8 ? b+14 : 0); ctx.lineTo(ngx+18, b+14 < 8 ? b+14 : 0); ctx.stroke();
    }
  });

  // ── 5. SIDE WALLS — rough concrete / stone ────────────
  const wallBase  = isArena ? '#191b15' : '#14152a';
  const wallMid   = isArena ? '#21241c' : '#1c1e30';
  const wallFront = isArena ? '#2a2e24' : '#24273e';

  // Left wall 3 layers
  for (let layer = 0; layer < 3; layer++) {
    const wc = [wallBase, wallMid, wallFront][layer];
    const spd = layer * 0.012;
    ctx.fillStyle = wc; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(0,0);
    for (let y = 0; y <= BH; y += 10) {
      const wx = (22 + layer*12) + Math.sin(y*0.05 + camX*spd + layer*1.2)*16 + Math.sin(y*0.12 + layer*0.7)*5;
      ctx.lineTo(wx, y);
    }
    ctx.lineTo(0, BH); ctx.closePath(); ctx.fill();
  }
  // Right wall 3 layers
  for (let layer = 0; layer < 3; layer++) {
    const wc = [wallBase, wallMid, wallFront][layer];
    const spd = layer * 0.012;
    ctx.fillStyle = wc; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(BW, 0);
    for (let y = 0; y <= BH; y += 10) {
      const wx = BW - (22 + layer*12) - Math.sin(y*0.05 + camX*spd + layer*2.1)*16 - Math.sin(y*0.12 + layer*1.0)*5;
      ctx.lineTo(wx, y);
    }
    ctx.lineTo(BW, BH); ctx.closePath(); ctx.fill();
  }

  // ── 6. PIPES on walls ────────────────────────────────
  const pipeCol  = isArena ? '#334433' : '#223355';
  const pipeHigh = isArena ? '#4a6640' : '#334477';
  const pipeLeak = isArena ? '#66aa44' : '#4466cc';
  const pipeYs   = [70, 140, 220, 310];
  pipeYs.forEach((py, pi) => {
    const px2 = ((pi * 280 + 30 - camX * 0.6) % (BW + 280) + BW + 280) % (BW + 280) - 60;
    const pw = 120 + pi*20;
    // Pipe body
    const pg = ctx.createLinearGradient(px2, py-6, px2, py+6);
    pg.addColorStop(0, pipeHigh); pg.addColorStop(0.5, pipeCol); pg.addColorStop(1, '#111');
    ctx.fillStyle = pg; ctx.globalAlpha = 1;
    ctx.fillRect(px2, py-6, pw, 12);
    // Pipe bolts
    ctx.fillStyle = pipeHigh;
    [px2+8, px2+pw-8].forEach(boltX => {
      ctx.fillRect(boltX-3, py-8, 6, 16);
      ctx.fillStyle = '#111'; ctx.fillRect(boltX-1, py-8, 2, 16);
      ctx.fillStyle = pipeHigh;
    });
    // Leak/drip
    if (pi % 2 === 0) {
      const lp = Math.abs(Math.sin(t*0.05 + pi*1.4));
      ctx.fillStyle = pipeLeak; ctx.shadowColor = pipeLeak; ctx.shadowBlur = 6;
      ctx.globalAlpha = 0.6 * lp;
      ctx.beginPath(); ctx.arc(px2 + pw*0.6, py + 6 + 10*lp, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  });

  // ── 7. FLUORESCENT / BARE BULB LIGHTS ─────────────────
  const bulbCol  = isArena ? '#c8d8a0' : '#88aadd';
  const bulbCol2 = isArena ? '#e8f0c0' : '#aaccff';
  const lightSpacing = 200;
  for (let i = 0; i < 5; i++) {
    const lx = ((i * lightSpacing + 50 - camX * 0.7) % (BW + lightSpacing) + BW + lightSpacing) % (BW + lightSpacing) - 30;
    const flicker = 0.82 + Math.sin(t * (0.11 + i*0.03) + i*2.1) * 0.18;
    // Fixture tube
    ctx.fillStyle = '#333'; ctx.globalAlpha = 1;
    ctx.fillRect(lx - 18, 30, 36, 5);
    ctx.fillRect(lx - 2, 35, 4, 10);
    // Light glow cone downward
    const coneG = ctx.createLinearGradient(lx, 44, lx, 260);
    coneG.addColorStop(0, `rgba(${isArena?'180,210,120':'120,160,220'},${0.25*flicker})`);
    coneG.addColorStop(1, 'transparent');
    ctx.fillStyle = coneG; ctx.globalAlpha = flicker;
    ctx.beginPath();
    ctx.moveTo(lx-4, 44); ctx.lineTo(lx+4, 44);
    ctx.lineTo(lx+90, 260); ctx.lineTo(lx-90, 260);
    ctx.closePath(); ctx.fill();
    // Bulb glow
    ctx.fillStyle = bulbCol2; ctx.shadowColor = bulbCol2; ctx.shadowBlur = 22*flicker;
    ctx.globalAlpha = flicker;
    ctx.beginPath(); ctx.arc(lx, 40, 5, 0, Math.PI*2); ctx.fill();
    // Ambient halo
    ctx.fillStyle = bulbCol; ctx.shadowColor = bulbCol; ctx.shadowBlur = 35*flicker;
    ctx.globalAlpha = 0.18 * flicker;
    ctx.beginPath(); ctx.arc(lx, 40, 35, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ── 8. FLOOR — wet concrete / grime ───────────────────
  const floorCol  = isArena ? '#1a1d15' : '#141620';
  const floorCol2 = isArena ? '#252820' : '#1e2030';
  const floorG = ctx.createLinearGradient(0, 410, 0, BH);
  floorG.addColorStop(0, floorCol); floorG.addColorStop(1, floorCol2);
  ctx.fillStyle = floorG; ctx.globalAlpha = 1;
  ctx.fillRect(0, 410, BW, BH-410);
  // Floor tile grouting lines
  ctx.strokeStyle = isArena ? '#111310' : '#10111a'; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
  for (let tx2 = 0; tx2 < BW; tx2 += 48) {
    const tfx = ((tx2 - camX * 0.9) % (BW+48) + BW+48) % (BW+48) - 24;
    ctx.beginPath(); ctx.moveTo(tfx, 410); ctx.lineTo(tfx, BH); ctx.stroke();
  }
  for (let ty = 415; ty < BH; ty += 28) {
    ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(BW, ty); ctx.stroke();
  }
  // Wet puddle reflection shimmer
  const wetCol = isArena ? '#3a4a2a' : '#2a3050';
  for (let i = 0; i < 4; i++) {
    const wx2 = ((i * 250 + 90 - camX * 0.85) % (BW+250) + BW+250) % (BW+250) - 50;
    const ws  = 50 + Math.sin(i*1.7)*20;
    const pulseW = 0.5 + Math.sin(t*0.04+i*1.3)*0.3;
    ctx.fillStyle = wetCol; ctx.globalAlpha = 0.35 * pulseW;
    ctx.beginPath(); ctx.ellipse(wx2, 430, ws, 7, 0, 0, Math.PI*2); ctx.fill();
    // highlight
    ctx.fillStyle = isArena ? '#8aaa6a' : '#6688cc';
    ctx.globalAlpha = 0.12 * pulseW;
    ctx.beginPath(); ctx.ellipse(wx2, 428, ws*0.5, 3, 0, 0, Math.PI*2); ctx.fill();
  }

  // ── 9. GRAFFITI / MARKINGS on walls (level 2 only) ───
  if (isArena) {
    const tags = ['SHADOW', '▼', '?', '⚠'];
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#88cc44';
    ctx.font = 'bold 13px "Courier New"';
    tags.forEach((tag, i) => {
      const tx2 = ((i * 270 + 15 - camX * 0.55) % (BW+270) + BW+270) % (BW+270) - 40;
      ctx.fillText(tag, tx2, 200 + i*28);
    });
  } else {
    // Level 3: ancient runes carved into wall
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = '#4455aa'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) {
      const rx2 = ((i * 220 + 20 - camX * 0.5) % (BW+220) + BW+220) % (BW+220) - 40;
      ctx.beginPath(); ctx.arc(rx2, 190 + i*18, 8, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx2-8, 190+i*18); ctx.lineTo(rx2+8, 190+i*18); ctx.stroke();
    }
  }

  // ── 10. TOP VIGNETTE — oppressive ceiling dark ────────
  const topVig = ctx.createLinearGradient(0, 0, 0, 80);
  topVig.addColorStop(0, isArena ? 'rgba(5,6,4,0.98)' : 'rgba(3,4,10,0.98)');
  topVig.addColorStop(1, 'transparent');
  ctx.fillStyle = topVig; ctx.globalAlpha = 1;
  ctx.fillRect(0, 0, BW, 80);

  // ── 11. AMBIENT FOG MID-DEPTH ─────────────────────────
  const midFog = ctx.createLinearGradient(0, 140, 0, 380);
  midFog.addColorStop(0, 'transparent');
  midFog.addColorStop(0.4, isArena ? 'rgba(20,28,14,0.22)' : 'rgba(10,14,28,0.25)');
  midFog.addColorStop(1, 'transparent');
  ctx.fillStyle = midFog; ctx.globalAlpha = 1;
  ctx.fillRect(0, 140, BW, 240);

  ctx.globalAlpha = 1;
}


function drawPlatforms() {
  // Level 0: city concrete/metal  |  Level 1: underground sewer  |  Level 2: deep undercity
  const edgeCols = ['#aabbcc', '#88aa66', '#6688cc'];
  const topFills = [
    ['#6a7a88','#4a5a68'],   // level 0 – concrete slab
    ['#2a3022','#1a2016'],   // level 1 – mossy stone slab
    ['#1e2230','#141828'],   // level 2 – dark stone
  ];
  const ec = edgeCols[Math.min(currentLevel,2)];
  const tf = topFills[Math.min(currentLevel,2)];
  for (const p of platforms) {
    const sx = p.x - camX;
    if (sx > BW+20 || sx+p.w < -20) continue;
    const g = ctx.createLinearGradient(0, p.y, 0, p.y+p.h);
    g.addColorStop(0, tf[0]); g.addColorStop(1, tf[1]);
    ctx.fillStyle = g; ctx.fillRect(sx, p.y, p.w, p.h);
    // Side edge
    ctx.strokeStyle = ec + '44'; ctx.lineWidth = 1;
    ctx.strokeRect(sx, p.y, p.w, p.h);
    // Glowing top edge
    ctx.shadowColor = ec; ctx.shadowBlur = currentLevel===0 ? 4 : 10;
    ctx.strokeStyle = ec; ctx.lineWidth = currentLevel===0 ? 2.5 : 1.5;
    ctx.beginPath(); ctx.moveTo(sx, p.y); ctx.lineTo(sx+p.w, p.y); ctx.stroke();
    ctx.shadowBlur = 0;
    // Corner bolts / rivets
    ctx.fillStyle = ec + 'cc';
    [sx+3, sx+p.w-7].forEach(bx => ctx.fillRect(bx, p.y+2, 5, 5));
    // Level 0 — concrete texture lines
    if (currentLevel === 0) {
      ctx.strokeStyle = 'rgba(80,95,110,0.3)'; ctx.lineWidth = 1;
      for (let lx = sx+20; lx < sx+p.w-10; lx += 25) {
        ctx.beginPath(); ctx.moveTo(lx, p.y); ctx.lineTo(lx, p.y+p.h); ctx.stroke();
      }
    }
  }
}

// Draw a stylised figure — isVector=true uses Vector's colorful outfit
function drawFig(e, eyeCol, isRunning, isAttacking, isKicking, isHurt, isSlide, isWall, isVector) {
  const cx = e.x - camX + e.w/2;
  const bot = e.y + e.h;
  const t  = e.anim || frame;
  const f  = e.facing;
  const bw = e.w * 0.55;
  const headR = e.w * 0.36;
  const H = e.h;

  ctx.save();
  ctx.translate(cx, bot);

  let lean = 0;
  if (isRunning)   lean = f * 0.18;
  if (isAttacking) lean = f * 0.28;
  if (isHurt)      lean = -f * 0.35;
  if (isWall)      lean = f * -0.4;
  ctx.rotate(lean);

  // ── VECTOR (player) full-colour outfit ─────────────────
  if (isVector) {
    // ─ Slide pose ─
    if (isSlide) {
      // Torso
      ctx.fillStyle = '#cc2200'; ctx.fillRect(-e.w/2, -H*0.32, e.w*0.65, H*0.32);
      // Legs
      ctx.fillStyle = '#111122'; ctx.fillRect(-e.w/2+2, -H*0.18, e.w*0.6, H*0.2);
      // Shoes
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-e.w/2+2, -H*0.09, e.w*0.35, H*0.1);
      // Head
      ctx.fillStyle = '#e8b87a'; ctx.beginPath(); ctx.arc(f*e.w*0.22, -H*0.38, headR*0.9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#cc2200'; ctx.beginPath(); ctx.arc(f*e.w*0.22, -H*0.38, headR*0.7, 0, Math.PI, true); ctx.fill(); // cap top
      glowEye(f*e.w*0.22 + f*headR*0.4, -H*0.38, '#ffffff');
      ctx.restore(); return;
    }

    const run = Math.sin(t*0.55);
    const legSwing = isRunning ? run*22 : (isAttacking ? -12 : (isKicking ? 28*f : 0));
    const armSwing = isRunning ? -run*20 : (isAttacking ? f*-75 : (isKicking ? -12 : 0));

    // --- Legs (pants dark blue) ---
    const legW = 8;
    ctx.fillStyle = '#111133';
    // Left leg
    ctx.save(); ctx.translate(-e.w*0.14, -H*0.28);
    ctx.rotate((legSwing-5)*Math.PI/180);
    ctx.fillRect(-legW/2, 0, legW, H*0.38);
    // Shoe left
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-legW/2-1, H*0.36, legW+4, H*0.07);
    ctx.restore();
    // Right leg
    ctx.fillStyle = '#111133';
    ctx.save(); ctx.translate(e.w*0.14, -H*0.28);
    ctx.rotate((-legSwing+5)*Math.PI/180);
    ctx.fillRect(-legW/2, 0, legW, H*0.38);
    // Shoe right
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-legW/2-1, H*0.36, legW+4, H*0.07);
    ctx.restore();

    // --- Torso (red jacket) ---
    const jacketG = ctx.createLinearGradient(-bw/2, -H*0.7, bw/2, -H*0.28);
    jacketG.addColorStop(0, '#dd2200');
    jacketG.addColorStop(0.4, '#ff3300');
    jacketG.addColorStop(1, '#aa1a00');
    ctx.fillStyle = jacketG;
    ctx.fillRect(-bw/2, -H*0.7, bw, H*0.44);
    // White chest stripe
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-3, -H*0.68, 6, H*0.36);
    // Jacket collar
    ctx.fillStyle = '#ff4422';
    ctx.beginPath();
    ctx.moveTo(-6, -H*0.7); ctx.lineTo(0, -H*0.65); ctx.lineTo(6, -H*0.7);
    ctx.closePath(); ctx.fill();

    // --- Arms ---
    const armW = 7;
    // Left arm (red sleeve)
    ctx.save(); ctx.translate(-bw/2, -H*0.65);
    ctx.rotate((armSwing-15)*Math.PI/180);
    ctx.fillStyle = '#cc1a00'; ctx.fillRect(-armW/2, 0, armW, H*0.22);
    // Glove left (dark)
    ctx.fillStyle = '#222'; ctx.fillRect(-armW/2-1, H*0.22, armW+2, H*0.1);
    // Fist left
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(0, H*0.32, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();
    // Right arm
    ctx.save(); ctx.translate(bw/2, -H*0.65);
    ctx.rotate((-armSwing+15)*Math.PI/180);
    if (isAttacking) {
      ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#ff9900'; // glowing punch arm
    } else {
      ctx.fillStyle = '#cc1a00';
    }
    ctx.fillRect(-armW/2, 0, armW, H*0.22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#222'; ctx.fillRect(-armW/2-1, H*0.22, armW+2, H*0.1);
    // Fist right
    if (isAttacking) {
      ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 20;
      ctx.fillStyle = '#ff9900';
    } else {
      ctx.fillStyle = '#333';
    }
    ctx.beginPath(); ctx.arc(0, H*0.32, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#555'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();

    // Kick trail
    if (isKicking) {
      ctx.save();
      ctx.translate(f*e.w*0.14, -H*0.18);
      ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 22;
      ctx.fillStyle = '#ff7700';
      ctx.fillRect(-legW/2, 0, legW, H*0.28);
      ctx.shadowBlur = 0; ctx.restore();
    }

    // --- Head (skin + red cap) ---
    // Skin
    ctx.fillStyle = '#e8b87a';
    ctx.beginPath(); ctx.arc(0, -H*0.84, headR, 0, Math.PI*2); ctx.fill();
    // Red cap
    ctx.fillStyle = '#cc1100';
    ctx.beginPath(); ctx.arc(0, -H*0.84, headR, Math.PI, 0); ctx.fill();
    ctx.fillRect(-headR, -H*0.84-2, headR*2, headR*0.3);
    // Cap brim
    ctx.fillStyle = '#aa0000';
    ctx.fillRect(-headR*1.3 * (f > 0 ? 0 : 1) - (f > 0 ? 0 : headR*0.3), -H*0.84 + headR*0.05, headR*1.6, headR*0.22);
    // Visor shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(f*headR*0.1, -H*0.84 + headR*0.05, f*headR*0.9, headR*0.22);
    // Eye
    glowEye(f * headR*0.48, -H*0.84 + headR*0.08, '#ffffff');

    ctx.restore(); return;
  }

  // ── ENEMY / BOSS: dark silhouette ──────────────────────
  ctx.fillStyle = '#050508';
  ctx.strokeStyle = '#050508';

  if (isSlide) {
    ctx.fillRect(-e.w/2, -H*0.32, e.w, H*0.32);
    ctx.beginPath(); ctx.arc(f * e.w*0.2, -H*0.38, headR*0.9, 0, Math.PI*2); ctx.fill();
    glowEye(f * e.w*0.2 + f*headR*0.4, -H*0.38, eyeCol);
    ctx.restore(); return;
  }

  ctx.fillRect(-bw/2, -H*0.7, bw, H*0.42);
  ctx.beginPath(); ctx.arc(0, -H*0.84, headR, 0, Math.PI*2); ctx.fill();

  const legSwing = isRunning ? Math.sin(t*0.55)*20 : (isAttacking ? -10 : (isKicking ? 25*f : 0));
  ctx.save(); ctx.translate(-e.w*0.15, -H*0.28);
  ctx.rotate((legSwing-5)*Math.PI/180);
  ctx.fillRect(-4.5, 0, 9, H*0.42); ctx.restore();
  ctx.save(); ctx.translate(e.w*0.15, -H*0.28);
  ctx.rotate((-legSwing+5)*Math.PI/180);
  ctx.fillRect(-4.5, 0, 9, H*0.42); ctx.restore();

  const armSwing = isRunning ? -Math.sin(t*0.55)*18 : (isAttacking ? f*-70 : (isKicking ? -10 : 0));
  ctx.save(); ctx.translate(-bw/2, -H*0.62);
  ctx.rotate((armSwing-15)*Math.PI/180);
  ctx.fillRect(-3.5, 0, 7, H*0.3);
  // Enemy fist left
  ctx.beginPath(); ctx.arc(0, H*0.3, 4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(bw/2, -H*0.62);
  ctx.rotate((-armSwing+15)*Math.PI/180);
  if (isAttacking) { ctx.shadowColor = eyeCol; ctx.shadowBlur = 18; ctx.fillStyle = eyeCol; }
  ctx.fillRect(-3.5, 0, 7, H*0.3);
  // Enemy fist right
  if (isAttacking) { ctx.shadowColor = eyeCol; ctx.shadowBlur = 18; ctx.fillStyle = eyeCol; }
  ctx.beginPath(); ctx.arc(0, H*0.3, 4, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#050508'; ctx.restore();

  if (isKicking) {
    ctx.save(); ctx.translate(f*e.w*0.15, -H*0.18);
    ctx.shadowColor = eyeCol; ctx.shadowBlur = 18; ctx.fillStyle = eyeCol;
    ctx.fillRect(-4, 0, 8, H*0.3); ctx.shadowBlur = 0; ctx.restore();
  }

  // Fog/smoke outline on enemy
  ctx.shadowColor = eyeCol + '66'; ctx.shadowBlur = 12;
  ctx.strokeStyle = '#050508'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.arc(0, -H*0.84, headR, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  glowEye(f * headR*0.45, -H*0.84, eyeCol);
  ctx.restore();
}

function glowEye(x, y, col) {
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 14;
  ctx.fillStyle   = col;
  ctx.fillRect(x - 4, y - 2.5, 9, 5);
  ctx.shadowBlur = 0; ctx.restore();
}

function drawPlayer() {
  if (P.iframes > 0 && Math.floor(P.iframes/4)%2===1) return;
  const p = P;

  // Attack range indicator
  if (p.atkTimer > 3 && p.atkTimer < 18) {
    const ab = getAtkBox(p);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#ff6600';
    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 12;
    ctx.fillRect(ab.x - camX, ab.y, ab.w, ab.h);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  const s  = p.state;
  const ec = (s==='attack'||s==='kick') ? '#ff9900' : '#00ffee';
  drawFig(
    { ...p, anim: p.af },
    ec,
    s==='run', s==='attack', s==='kick', s==='hurt', p.slideH, s==='wallslide', true
  );
}

function drawEnemy(e) {
  const sx = e.x - camX;
  if (sx < -80 || sx > BW+80) return;
  if (e.hp <= 0) {
    ctx.globalAlpha = Math.max(0, (e.hp + 30) / 30);
  }
  const s  = e.state;
  drawFig(e, e.eyeCol, s==='chase', s==='attack', false, e.hurtTimer>0, false, false, false);
  ctx.globalAlpha = 1;

  // Small HP bar
  if (e.hp > 0 && e.hp < e.maxHp) {
    const bw = 28, bx = e.x - camX, by = e.y - 10;
    ctx.fillStyle = '#300'; ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = '#f44';
    ctx.fillRect(bx, by, bw * clamp(e.hp/e.maxHp, 0, 1), 4);
  }
}

function drawBoss() {
  if (!boss) return;
  const b = boss;

  // Aura
  const auraCol = b.eyeCol;
  ctx.globalAlpha = 0.1 + Math.sin(frame*0.12)*0.04;
  ctx.shadowColor = auraCol; ctx.shadowBlur = 50;
  ctx.fillStyle   = auraCol;
  ctx.beginPath();
  ctx.ellipse(b.x - camX + b.w/2, b.y + b.h*0.5, b.w*2, b.h*1.3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  drawFig(
    { ...b, anim: frame },
    auraCol,
    true, b.atkTimer > 5, false, b.hurtTimer > 0, false, false, false
  );

  // Boss HP bar
  const bw = 380, bx = BW/2 - bw/2, by = 18;
  ctx.fillStyle = '#1a0010';
  ctx.fillRect(bx, by, bw, 14);
  const hpPct = clamp(b.hp / b.maxHp, 0, 1);
  const bg = ctx.createLinearGradient(bx, 0, bx+bw, 0);
  bg.addColorStop(0, '#cc0033'); bg.addColorStop(0.5, '#ff0088'); bg.addColorStop(1, '#9900ff');
  ctx.fillStyle = bg;
  ctx.shadowColor = '#ff0080'; ctx.shadowBlur = 10;
  ctx.fillRect(bx, by, bw * hpPct, 14);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#ff0066'; ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by, bw, 14);
  ctx.fillStyle = '#ff88cc'; ctx.font = 'bold 10px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText('⟨ YOUR SHADOW SELF ⟩', BW/2, by - 4);
  ctx.textAlign = 'left';
}

// Level 1 exit portal
function drawPortal() {
  if (currentLevel !== 0) return;
  const x = 3960 - camX, y = 360;
  const t = frame;
  ctx.save();
  ctx.shadowColor = '#8800ff'; ctx.shadowBlur = 30;
  ctx.strokeStyle = '#aa44ff'; ctx.lineWidth = 3;
  for (let r = 20; r <= 50; r += 15) {
    ctx.globalAlpha = 0.4 + Math.sin(t*0.08 + r)*0.3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = '#6600cc';
  ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.restore();
}

function drawHUD() {
  // Player HP
  const hbW = 140, hbX = 18, hbY = 18;
  ctx.fillStyle = '#080018';
  ctx.fillRect(hbX, hbY, hbW, 11);
  const pct = clamp(P.hp / P.maxHp, 0, 1);
  const hcol = pct > 0.5 ? '#00ff88' : pct > 0.25 ? '#ffaa00' : '#ff2244';
  ctx.fillStyle = hcol; ctx.shadowColor = hcol; ctx.shadowBlur = 8;
  ctx.fillRect(hbX, hbY, hbW * pct, 11);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#003328'; ctx.lineWidth = 1;
  ctx.strokeRect(hbX, hbY, hbW, 11);
  ctx.fillStyle = '#88ffcc'; ctx.font = 'bold 9px "Courier New"';
  ctx.fillText('HP', hbX + 2, hbY - 3);

  // Lives (hearts)
  ctx.font = '14px serif';
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = i < P.lives ? 1 : 0.18;
    ctx.shadowColor = '#ff2244'; ctx.shadowBlur = i < P.lives ? 8 : 0;
    ctx.fillStyle = i < P.lives ? '#ff2244' : '#442233';
    ctx.fillText('♥', hbX + i * 20, hbY + 30);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  // Level name
  const names = ['PARKOUR ESCAPE', 'UNDERGROUND ARENA', 'BOSS FIGHT'];
  ctx.fillStyle = 'rgba(0,20,40,0.55)';
  ctx.fillRect(BW/2 - 75, 8, 150, 16);
  ctx.fillStyle = '#4499ff'; ctx.font = 'bold 9px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText(names[currentLevel], BW/2, 20);
  ctx.textAlign = 'left';

  // Wave counter for arena
  if (currentLevel === 1 && wave <= 3) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#aaaaff'; ctx.font = 'bold 10px "Courier New"';
    ctx.fillText(`WAVE ${wave} / 3`, BW - 18, 24);
    ctx.textAlign = 'left';
  }

  // Wave announce banner
  if (waveAnnounce > 0 && currentLevel === 1) {
    waveAnnounce--;
    const a = waveAnnounce > 90 ? 1 : waveAnnounce / 90;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,20,0.7)';
    ctx.fillRect(BW/2 - 120, BH/2 - 24, 240, 42);
    ctx.fillStyle = '#6688ff'; ctx.font = 'bold 18px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(`— WAVE ${wave} —`, BW/2, BH/2 + 4);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  // Controls tip
  if (levelTimer < 210) {
    const a = levelTimer < 160 ? 1 : (210-levelTimer)/50;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(BW/2 - 200, BH - 36, 400, 22);
    ctx.fillStyle = '#446688'; ctx.font = '9px "Courier New"';
    ctx.textAlign = 'center';
    const tips = [
      'A/D: Move · Space/W: Jump · S: Slide (while running) · Z: Punch · X: Kick · Wall-Jump: jump while touching wall',
      'Defeat all enemies to advance — combo punches and kicks for max damage',
      'Z: Punch · X: Kick · Dodge attacks! Your Shadow Self mirrors your style'
    ];
    ctx.fillText(tips[currentLevel], BW/2, BH - 21);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

function drawMenu() {
  const t = frame;

  // BG — city at dusk/night intro
  const mg = ctx.createLinearGradient(0, 0, 0, BH);
  mg.addColorStop(0,   '#0a1628');
  mg.addColorStop(0.4, '#152035');
  mg.addColorStop(0.75,'#1e2a3a');
  mg.addColorStop(1,   '#0d1520');
  ctx.fillStyle = mg; ctx.fillRect(0, 0, BW, BH);

  // City silhouette
  ctx.fillStyle = '#0d1825'; ctx.globalAlpha = 1;
  const menuBuilds = [0,80,55,120,65,90,145,50,185,75,240,55,295,100,365,60,410,85,475,50,520,110,600,65,645,90,700,55,740,80];
  for (let i = 0; i < menuBuilds.length; i+=3) {
    const mbx = menuBuilds[i], mbw = menuBuilds[i+1]||55, mbh = menuBuilds[i+2]||90;
    ctx.fillRect(mbx, BH-mbh, mbw, mbh);
    // Window lights
    ctx.fillStyle = 'rgba(255,220,120,0.3)';
    for (let wy = BH-mbh+8; wy < BH-12; wy+=14) {
      for (let wx = mbx+5; wx < mbx+mbw-7; wx+=9) {
        if (Math.sin(wx*4.7+wy*2.3)>0.2) ctx.fillRect(wx, wy, 5, 7);
      }
    }
    ctx.fillStyle = '#0d1825';
  }

  // Stalactites on ceiling as cave intro
  for (let i = 0; i < 12; i++) {
    const sx = (i * 145 + t*0.12) % (BW + 80) - 20;
    const sh = 28 + Math.sin(i*2.1)*16;
    const sg = ctx.createLinearGradient(sx, 0, sx, sh);
    sg.addColorStop(0, '#0a1525'); sg.addColorStop(1, '#00aaff44');
    ctx.fillStyle = sg; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.moveTo(sx-6,0); ctx.lineTo(sx+6,0); ctx.lineTo(sx+2,sh); ctx.lineTo(sx-2,sh); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Moving Vector runner (colorful preview on menu)
  const rx = (t * 2.5) % (BW + 120) - 60;
  ctx.globalAlpha = 0.22;
  drawFig({ x: rx, y: 360, w: 26, h: 50, facing: 1, anim: t }, '#ffffff', true, false, false, false, false, false, true);
  ctx.globalAlpha = 1;

  // Title
  ctx.textAlign = 'center';
  ctx.shadowColor = '#1144ff'; ctx.shadowBlur = 50;
  ctx.fillStyle   = '#2255ff';
  ctx.font = 'bold 78px "Courier New"';
  ctx.fillText('SHADOW', BW/2, 155);

  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 25;
  ctx.fillStyle   = '#eeeeff';
  ctx.fillText('DESCENT', BW/2, 245);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#222840'; ctx.font = '13px "Courier New"';
  ctx.fillText('BENEATH  THE  SURFACE', BW/2, 278);

  // Pulsing start
  const pa = 0.55 + Math.sin(t*0.1)*0.45;
  ctx.globalAlpha = pa;
  ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 15px "Courier New"';
  ctx.fillText('[ PRESS SPACE TO DESCEND ]', BW/2, 335);
  ctx.globalAlpha = 1;

  // Controls
  ctx.fillStyle = '#1a2433'; ctx.font = '10px "Courier New"';
  ctx.fillText('WASD / ARROWS: Move · Space/W: Jump · S: Slide · Z: Punch · X: Kick', BW/2, 400);
  ctx.fillText('Wall-Jump: Press jump while touching a vertical wall', BW/2, 418);
  ctx.textAlign = 'left';
}

function drawTransition() {
  const prog = 1 - transTimer / 130;
  transTimer--;
  ctx.fillStyle = `rgba(0,0,0,${Math.min(prog * 3, 0.9)})`;
  ctx.fillRect(0, 0, BW, BH);
  if (prog > 0.4) {
    const alpha = Math.min((prog - 0.4) * 2.5, 1);
    ctx.globalAlpha = alpha;
    ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 30;
    ctx.fillStyle   = '#6699ff';
    ctx.font = 'bold 20px "Courier New"';
    ctx.textAlign = 'center';
    transText.split('\n').forEach((line, i) => ctx.fillText(line, BW/2, BH/2 - 10 + i*28));
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, BW, BH);
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 40;
  ctx.fillStyle   = '#ff1111'; ctx.font = 'bold 62px "Courier New"';
  ctx.fillText('YOU FELL', BW/2, BH/2 - 15);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#774444'; ctx.font = '13px "Courier New"';
  ctx.fillText('all 3 lives consumed by the shadow', BW/2, BH/2 + 22);
  const pa = 0.55 + Math.sin(frame*0.1)*0.45;
  ctx.globalAlpha = pa;
  ctx.fillStyle = '#ff6666'; ctx.font = 'bold 14px "Courier New"';
  ctx.fillText('[ PRESS SPACE TO RISE AGAIN ]', BW/2, BH/2 + 70);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawVictory() {
  ctx.fillStyle = 'rgba(0,0,10,0.82)'; ctx.fillRect(0, 0, BW, BH);
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 45;
  ctx.fillStyle   = '#ff44ff'; ctx.font = 'bold 54px "Courier New"';
  ctx.fillText('SHADOW', BW/2, BH/2 - 65);
  ctx.fillStyle   = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20;
  ctx.fillText('CONQUERED', BW/2, BH/2);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#886699'; ctx.font = '12px "Courier New"';
  ctx.fillText('You faced what lurked beneath', BW/2, BH/2 + 44);
  ctx.fillText('and emerged from the darkness', BW/2, BH/2 + 62);
  const pa = 0.55 + Math.sin(frame*0.09)*0.45;
  ctx.globalAlpha = pa;
  ctx.fillStyle   = '#cc88ff'; ctx.font = 'bold 13px "Courier New"';
  ctx.fillText('[ PRESS SPACE TO PLAY AGAIN ]', BW/2, BH/2 + 108);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// Scanline overlay
function drawScanlines() {
  ctx.globalAlpha = 0.04;
  ctx.fillStyle = '#000';
  for (let y = 0; y < BH; y += 3) ctx.fillRect(0, y, BW, 1);
  ctx.globalAlpha = 1;
}

// ── MAIN LOOP ────────────────────────────────────────────────
function loop() {
  frame++;

  // Screen shake
  let sx = 0, sy = 0;
  if (shk > 0) { sx = rnd(-shkMag, shkMag); sy = rnd(-shkMag, shkMag); shk--; }
  ctx.save();
  ctx.translate(sx, sy);

  if (gameState === 'menu') {
    drawMenu();
    if (JP['Space'] || JP['Enter']) {
      currentLevel = 0; buildLevel1(); setState('playing'); levelTimer = 0;
    }

  } else if (gameState === 'playing') {
    levelTimer++;
    tickParts();
    tickPlayer();
    tickEnemies();

    drawBG();
    drawPortal();
    drawPlatforms();
    drawParts(camX);
    enemies.forEach(drawEnemy);
    if (boss) drawBoss();
    drawPlayer();
    drawHUD();

  } else if (gameState === 'transition') {
    // Keep rendering game behind
    drawBG(); drawPlatforms();
    if (boss) drawBoss();
    drawPlayer();
    drawTransition();

  } else if (gameState === 'gameover') {
    drawBG(); drawPlatforms(); drawPlayer();
    drawGameOver();
    if (JP['Space']) { currentLevel = 0; buildLevel1(); setState('playing'); levelTimer = 0; }

  } else if (gameState === 'victory') {
    drawBG();
    drawVictory();
    if (JP['Space']) { currentLevel = 0; buildLevel1(); setState('playing'); levelTimer = 0; }
  }

  drawScanlines();
  ctx.restore();

  // Clear JP
  for (const k in JP) delete JP[k];
  requestAnimationFrame(loop);
}

loop();
</script>
